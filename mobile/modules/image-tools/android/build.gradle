plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ohavs.car360'
version = '1.0.0'

android {
  namespace "expo.modules.car360imagetools"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // on-device subject segmentation: the model comes from Google Play services
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
