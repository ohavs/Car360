name: Android

# Builds the Android app and publishes it as a GitHub Release, which is where
# the in-app updater (Settings → App updates) finds new versions.
#   main       → stable release (the "latest" release)
#   any branch → beta pre-release
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      # one number per build, always increasing — Android only installs an
      # update whose versionCode is higher than the installed one
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      CAR360_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'beta' }}
      # optional: "smart scan" of policies and receipts (Gemini). Without it the
      # scan buttons simply don't show. Restrict the key to this Android app.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          # release notes are the commit subjects since the previous release tag
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npx eslint .

      - name: Firebase config
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # accept the file pasted as-is or base64-encoded
            if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            fi
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No Firebase config::GOOGLE_SERVICES_JSON secret is missing — building with a placeholder (sign-in will not work) and not publishing a release."
            node scripts/placeholder-google-services.mjs
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # all four or none: a half-configured key would fail the build late
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] &&
             [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/car360-release.jks"
            echo "CAR360_KEYSTORE_PATH=$RUNNER_TEMP/car360-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No signing key::One of the ANDROID_KEY* / ANDROID_KEYSTORE_* secrets is missing — signing with the debug key and not publishing a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: mobile/android
        env:
          CAR360_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAR360_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAR360_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Name the build
        id: meta
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION_NAME}-b${ANDROID_VERSION_CODE}"
          APK_NAME="car360-${VERSION_NAME}-b${ANDROID_VERSION_CODE}.apk"
          PREVIOUS_TAG=$(git tag --list 'android-v*' --sort=-creatordate | head -n 1)
          mkdir -p "$RUNNER_TEMP/release"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/$APK_NAME"
          {
            echo "tag=$TAG"
            echo "apk_name=$APK_NAME"
            echo "version_name=$VERSION_NAME"
            echo "previous_tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Write the update manifest
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
        run: node scripts/release-manifest.mjs "$RUNNER_TEMP/release/$APK_NAME" "$RUNNER_TEMP/release"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: |
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/latest.json
          retention-days: 14

      - name: Publish the release
        if: steps.firebase.outputs.real == 'true' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          FLAGS=(--latest)
          if [ "$CAR360_CHANNEL" != "stable" ]; then FLAGS=(--prerelease); fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/release/$APK_NAME" \
            "$RUNNER_TEMP/release/latest.json" \
            --target "$GITHUB_SHA" \
            --title "Car360 ${VERSION_NAME} (build ${ANDROID_VERSION_CODE})" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "${FLAGS[@]}"

      - name: Prune old beta releases
        if: steps.firebase.outputs.real == 'true' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep the five newest pre-releases; stable releases are never touched
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("android-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done
