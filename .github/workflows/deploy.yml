name: Deploy to Firebase

on:
  push:
    branches:
      - claude/car-management-app-q76ejk
      - main
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: enables Gemini-powered "smart scan". Without the secret the
          # app falls back to on-device Tesseract OCR. Set it under
          # Settings → Secrets and variables → Actions.
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}

      - name: Deploy hosting + Firestore rules
        run: npx firebase-tools@13 deploy --only hosting,firestore:rules --project car360-50b44 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Storage rules deploy is separate so a project without Storage enabled
      # doesn't fail the whole pipeline; becomes active once Storage is set up
      - name: Deploy Storage rules (optional)
        continue-on-error: true
        run: npx firebase-tools@13 deploy --only storage --project car360-50b44 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
